<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개서 글자수 및 바이트 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .glass-banner {
            background: rgba(240, 240, 240, 0.5);
            border: 1px dashed #ccc;
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center py-10 px-4">

    <!-- Container -->
    <div class="w-full max-w-3xl flex-1 flex flex-col gap-6">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-3xl font-bold mb-2">글자수 및 바이트 계산기</h1>
            <p class="text-gray-600">자기소개서, 이력서 등 텍스트의 글자수와 바이트를 실시간으로 확인하세요.</p>
        </header>

        <!-- AdSense Placeholder Top -->
        <div class="glass-banner w-full h-24 flex items-center justify-center rounded-xl text-gray-500 text-sm">
            [구글 애드센스 광고 자리]
        </div>

        <!-- Main Content -->
        <main class="glass rounded-2xl p-6 flex flex-col gap-4">
            <textarea id="textInput" class="w-full h-64 p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none bg-white/50" placeholder="여기에 텍스트를 입력하세요..."></textarea>
            
            <!-- Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-sm text-gray-500 mb-1">공백 포함</p>
                    <p class="text-2xl font-bold text-blue-600"><span id="countWithSpaces">0</span> <span class="text-sm font-normal text-gray-600">자</span></p>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-sm text-gray-500 mb-1">공백 제외</p>
                    <p class="text-2xl font-bold text-green-600"><span id="countWithoutSpaces">0</span> <span class="text-sm font-normal text-gray-600">자</span></p>
                </div>
                <div class="glass rounded-xl p-4 text-center">
                    <p class="text-sm text-gray-500 mb-1">바이트 (Byte)</p>
                    <p class="text-2xl font-bold text-purple-600"><span id="byteCount">0</span> <span class="text-sm font-normal text-gray-600">B</span></p>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-2">
                <button id="clearBtn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition-colors text-sm font-medium">초기화</button>
                <button id="copyBtn" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors text-sm font-medium">복사하기</button>
            </div>
        </main>

        <!-- AdSense Placeholder Bottom -->
        <div class="glass-banner w-full h-24 flex items-center justify-center rounded-xl text-gray-500 text-sm">
            [구글 애드센스 광고 자리]
        </div>

    </div>

    <!-- Footer -->
    <footer class="w-full max-w-3xl mt-12 pt-6 border-t border-gray-200/50 flex flex-col md:flex-row items-center justify-between text-sm text-gray-500">
        <p>&copy; 2026 Resume Text Counter. All rights reserved.</p>
        <div class="flex gap-4 mt-2 md:mt-0">
            <a href="terms.html" class="hover:text-gray-800 transition-colors">이용약관</a>
            <a href="privacy.html" class="hover:text-gray-800 transition-colors">개인정보처리방침</a>
        </div>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');
        const countWithSpaces = document.getElementById('countWithSpaces');
        const countWithoutSpaces = document.getElementById('countWithoutSpaces');
        const byteCount = document.getElementById('byteCount');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        // 바이트 계산 함수 (EUC-KR 기준 한글 2바이트, 영어/숫자/공백 1바이트)
        function getByteLength(str) {
            let byteLength = 0;
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode <= 0x00007F) {
                    byteLength += 1;
                } else {
                    byteLength += 2;
                }
            }
            return byteLength;
        }

        function updateStats() {
            const text = textInput.value;
            
            // 공백 포함 글자수 (줄바꿈 포함)
            const withSpaces = text.length;
            
            // 공백 제외 글자수 (모든 공백, 탭, 줄바꿈 제거)
            const withoutSpaces = text.replace(/[\s]/g, '').length;
            
            // 바이트 수
            const bytes = getByteLength(text);

            // UI 업데이트
            countWithSpaces.textContent = withSpaces.toLocaleString();
            countWithoutSpaces.textContent = withoutSpaces.toLocaleString();
            byteCount.textContent = bytes.toLocaleString();
        }

        textInput.addEventListener('input', updateStats);

        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            updateStats();
            textInput.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!textInput.value) return;
            try {
                await navigator.clipboard.writeText(textInput.value);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '복사완료!';
                copyBtn.classList.replace('bg-blue-500', 'bg-green-500');
                copyBtn.classList.replace('hover:bg-blue-600', 'hover:bg-green-600');
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.replace('bg-green-500', 'bg-blue-500');
                    copyBtn.classList.replace('hover:bg-green-600', 'hover:bg-blue-600');
                }, 2000);
            } catch (err) {
                alert('클립보드 복사에 실패했습니다.');
            }
        });

        // 초기화
        updateStats();
    </script>
</body>
</html>
