<script>
        const textInput = document.getElementById('textInput');
        const targetInput = document.getElementById('targetInput');
        const byteMode = document.getElementById('byteMode');
        const progressBar = document.getElementById('progressBar');
        const countWithSpaces = document.getElementById('countWithSpaces');
        const countWithoutSpaces = document.getElementById('countWithoutSpaces');
        const byteCount = document.getElementById('byteCount');
        const manuscriptCount = document.getElementById('manuscriptCount');
        const wordCount = document.getElementById('wordCount');
        const sentenceCount = document.getElementById('sentenceCount');
        const speechTime = document.getElementById('speechTime');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const autoSaveStatus = document.getElementById('autoSaveStatus');

        function calculateBytes(str, mode) {
            let bytes = 0;
            if (mode === 'utf-8') {
                return new Blob([str]).size;
            }
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                bytes += (code <= 0x007F) ? 1 : 2;
            }
            return bytes;
        }

        function updateStats() {
            const text = textInput.value;
            const target = parseInt(targetInput.value, 10) || 1000;
            const mode = byteMode.value;

            const withSpaces = [...text].length;
            const withoutSpaces = [...text.replace(/\s/g, '')].length;
            const bytes = calculateBytes(text, mode);
            
            const manuscript = Math.ceil(withSpaces / 200);

            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const sentences = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
            
            const minutes = withSpaces / 330;
            const totalSec = Math.round(minutes * 60);
            const formattedTime = totalSec >= 60 ? `${Math.floor(totalSec / 60)}분 ${totalSec % 60}초` : `${totalSec}초`;

            countWithSpaces.textContent = withSpaces.toLocaleString();
            countWithoutSpaces.textContent = withoutSpaces.toLocaleString();
            byteCount.textContent = bytes.toLocaleString();
            manuscriptCount.textContent = manuscript.toLocaleString();
            wordCount.textContent = words.toLocaleString();
            sentenceCount.textContent = sentences.toLocaleString();
            speechTime.textContent = formattedTime;

            const progress = Math.min(Math.round((withSpaces / target) * 100), 100);
            progressBar.style.width = `${progress}%`;
            if (withSpaces > target) {
                progressBar.className = 'bg-rose-500 h-2.5 rounded-full transition-all duration-300';
            } else {
                progressBar.className = 'bg-blue-600 h-2.5 rounded-full transition-all duration-300';
            }

            localStorage.setItem('resume_draft_text', text);
            autoSaveStatus.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> 자동 저장됨';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('resume_draft_text');
            if (saved) {
                textInput.value = saved;
            }
            updateStats();
        });

        textInput.addEventListener('input', updateStats);
        targetInput.addEventListener('input', updateStats);
        byteMode.addEventListener('change', updateStats);

        clearBtn.addEventListener('click', () => {
            if (textInput.value && !confirm('입력한 내용을 모두 지우시겠습니까?')) return;
            textInput.value = '';
            localStorage.removeItem('resume_draft_text');
            updateStats();
            textInput.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!textInput.value) return;
            copyBtn.disabled = true;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textInput.value);
                } else {
                    textInput.select();
                    document.execCommand('copy');
                }
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 복사완료!';
                copyBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> 복사하기';
                    copyBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                    copyBtn.disabled = false;
                }, 1500);
            } catch (e) {
                alert('복사에 실패했습니다. 직접 텍스트를 선택하여 복사해주세요.');
                copyBtn.disabled = false;
            }
        });
    </script>
<!-- Preemptive UX Helper: Auto comma formatting & Result sharing -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Auto comma on number/text inputs with currency hints
      const moneyInputs = document.querySelectorAll('input[type="text"], input[type="number"], input[inputmode="numeric"]');
      moneyInputs.forEach(input => {
        // Skip specific inputs like year, month, date, percent, id
        const name = (input.name || input.id || '').toLowerCase();
        if (name.includes('year') || name.includes('month') || name.includes('day') || name.includes('rate') || name.includes('percent') || name.includes('age') || name.includes('score')) {
          return;
        }
        
        // Listen to input
        input.addEventListener('input', function(e) {
          if (this.type === 'number') return; // native number handles own UI
          let val = this.value.replace(/[^0-9]/g, '');
          if (val) {
            this.value = Number(val).toLocaleString('ko-KR');
          }
        });
      });

      // Inject Global Result Copy Function if not exists
      window.copyResultToClipboard = function(textToCopy, customBtn) {
        if (!textToCopy) {
          const resEl = document.querySelector('#result, .result-box, [id*="result"], [class*="result"]');
          textToCopy = resEl ? resEl.innerText.trim() : window.location.href;
        }
        navigator.clipboard.writeText(textToCopy + "\n\n👉 계산기 바로가기: " + window.location.href).then(() => {
          showToastNotification('계산 결과가 클립보드에 복사되었습니다!');
        }).catch(() => {
          showToastNotification('복사되었습니다: ' + window.location.href);
        });
      };

      function showToastNotification(msg) {
        let toast = document.getElementById('global-ux-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'global-ux-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;transition:all 0.3s ease;opacity:0;pointer-events:none;';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(10px)';
        }, 2200);
      }
    });
  </script>
<!-- Global UX Helper: Universal Result Copy & Toast -->
<script>
    window.showToastNotification = function(msg) {
      let toast = document.getElementById('global-ux-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'global-ux-toast';
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;transition:all 0.3s ease;opacity:0;pointer-events:none;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
      }, 2200);
    };

    window.copyResultToClipboard = function(customText) {
      let textToCopy = customText;
      if (!textToCopy) {
        const resEl = document.querySelector('#resultBox, .result-card, #result, [id*="result"], [class*="result"], [id*="res"]');
        textToCopy = resEl ? resEl.innerText.trim() : document.title;
      }
      const fullText = textToCopy + "\n\n👉 바로가기: " + window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText).then(() => {
          window.showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
        }).catch(() => fallbackCopy(fullText));
      } else {
        fallbackCopy(fullText);
      }
    };

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        window.showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
      } catch (e) {
        window.showToastNotification('복사에 실패했습니다.');
      }
      document.body.removeChild(ta);
    }
  </script>
</body>
</html>
