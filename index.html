    <script>
        const textInput = document.getElementById('textInput');
        const targetInput = document.getElementById('targetInput');
        const byteMode = document.getElementById('byteMode');
        const progressBar = document.getElementById('progressBar');
        const countWithSpaces = document.getElementById('countWithSpaces');
        const countWithoutSpaces = document.getElementById('countWithoutSpaces');
        const byteCount = document.getElementById('byteCount');
        const manuscriptCount = document.getElementById('manuscriptCount');
        const wordCount = document.getElementById('wordCount');
        const sentenceCount = document.getElementById('sentenceCount');
        const speechTime = document.getElementById('speechTime');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const autoSaveStatus = document.getElementById('autoSaveStatus');

        function calculateBytes(str, mode) {
            let bytes = 0;
            if (mode === 'utf-8') {
                return new Blob([str]).size;
            }
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                bytes += (code <= 0x007F) ? 1 : 2;
            }
            return bytes;
        }

        function updateStats() {
            const text = textInput.value;
            const target = parseInt(targetInput.value, 10) || 1000;
            const mode = byteMode.value;

            const withSpaces = [...text].length;
            const withoutSpaces = [...text.replace(/\s/g, '')].length;
            const bytes = calculateBytes(text, mode);
            
            const manuscript = Math.ceil(withSpaces / 200);

            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const sentences = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
            
            const minutes = withSpaces / 330;
            const totalSec = Math.round(minutes * 60);
            const formattedTime = totalSec >= 60 ? `${Math.floor(totalSec / 60)}遺?${totalSec % 60}珥? : `${totalSec}珥?;

            countWithSpaces.textContent = withSpaces.toLocaleString();
            countWithoutSpaces.textContent = withoutSpaces.toLocaleString();
            byteCount.textContent = bytes.toLocaleString();
            manuscriptCount.textContent = manuscript.toLocaleString();
            wordCount.textContent = words.toLocaleString();
            sentenceCount.textContent = sentences.toLocaleString();
            speechTime.textContent = formattedTime;

            const progress = Math.min(Math.round((withSpaces / target) * 100), 100);
            progressBar.style.width = `${progress}%`;
            if (withSpaces > target) {
                progressBar.className = 'bg-rose-500 h-2.5 rounded-full transition-all duration-300';
            } else {
                progressBar.className = 'bg-blue-600 h-2.5 rounded-full transition-all duration-300';
            }

            localStorage.setItem('resume_draft_text', text);
            autoSaveStatus.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> ?먮룞 ??λ맖';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('resume_draft_text');
            if (saved) {
                textInput.value = saved;
            }
            updateStats();
        });

        textInput.addEventListener('input', updateStats);
        targetInput.addEventListener('input', updateStats);
        byteMode.addEventListener('change', updateStats);

        clearBtn.addEventListener('click', () => {
            if (textInput.value && !confirm('?낅젰???댁슜??紐⑤몢 吏?곗떆寃좎뒿?덇퉴?')) return;
            textInput.value = '';
            localStorage.removeItem('resume_draft_text');
            updateStats();
            textInput.focus();
        });

        copyBtn.addEventListener('click', async () => {
            if (!textInput.value) return;
            copyBtn.disabled = true;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textInput.value);
                } else {
                    textInput.select();
                    document.execCommand('copy');
                }
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 蹂듭궗?꾨즺!';
                copyBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> 蹂듭궗?섍린';
                    copyBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                    copyBtn.disabled = false;
                }, 1500);
            } catch (e) {
                alert('蹂듭궗???ㅽ뙣?덉뒿?덈떎. 吏곸젒 ?띿뒪?몃? ?좏깮?섏뿬 蹂듭궗?댁＜?몄슂.');
                copyBtn.disabled = false;
            }
        });
    </script>
